<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHAMQUANGIOS KEY</title>
<style>
body{font-family:system-ui;margin:0;background:#101114;color:#eee;display:grid;place-items:center;min-height:100vh}
.card{width:min(92%,430px);background:#1b1d22;border:1px solid #333;border-radius:18px;padding:24px;box-sizing:border-box}
h1{margin-top:0}input,button{width:100%;padding:13px;margin-top:10px;border-radius:10px;border:1px solid #444;background:#111;color:#fff;box-sizing:border-box}button{cursor:pointer;background:#2563eb;border:0}.msg{margin-top:14px;min-height:24px}.ok{color:#65d98b}.bad{color:#ff7272}.small{color:#999;font-size:13px}
</style>
</head>
<body><div class="card">
<h1>PHAMQUANGIOS</h1>
<p>Nhập KEY để kiểm tra.</p>
<input id="key" placeholder="Nhập key..." autocomplete="off">
<button id="check" type="button">KIỂM TRA KEY</button>
<div id="msg" class="msg"></div>
<div id="info" class="small"></div>
</div>
<script>
const API="https://oluwfxpqponqjbdptxve.supabase.co/functions/v1/key-check";
const SUPABASE_KEY="sb_publishable_667RSQDylhaS_ukr5S9aAg_FwXoPuRA";
const $=id=>document.getElementById(id);
function msg(t,ok){$("msg").textContent=t;$("msg").className="msg "+(ok?"ok":"bad")}
async function checkKey(){
  const key=$("key").value.trim();
  $("info").textContent="";
  if(!key){msg("Vui lòng nhập KEY.",false);return}
  $("check").disabled=true;$("check").textContent="ĐANG KIỂM TRA...";
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},body:JSON.stringify({key})});
    const text=await r.text();let j={};try{j=JSON.parse(text)}catch{}
    if(!r.ok) throw new Error(j.error||j.message||("HTTP "+r.status));
    const valid=j.valid===true || j.status==="active" || j.ok===true;
    if(valid){
      msg("✓ KEY HỢP LỆ",true);
      if(j.expires_at)$("info").textContent="Hết hạn: "+new Date(j.expires_at).toLocaleString();
      else if(j.expiresAt)$("info").textContent="Hết hạn: "+new Date(j.expiresAt).toLocaleString();
      else $("info").textContent="KEY đang hoạt động.";
    }else{
      msg("✕ KEY KHÔNG HỢP LỆ",false);
      $("info").textContent=j.error||j.message||j.status||"Key không hoạt động hoặc đã hết hạn.";
    }
  }catch(e){msg("Lỗi kết nối: "+e.message,false)}
  finally{$("check").disabled=false;$("check").textContent="KIỂM TRA KEY"}
}
$("check").addEventListener("click",checkKey);
$("key").addEventListener("keydown",e=>{if(e.key==="Enter")checkKey()});
</script></body></html>
